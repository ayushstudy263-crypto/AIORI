apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aioroi-federated-traffic
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/cloudrun/placeholder
          resources:
            limits:
              cpu: "1000m"
              memory: 512Mi
            requests:
              cpu: "1000m"
              memory: 512Mi
          ports:
            - name: http1
              containerPort: 3000
